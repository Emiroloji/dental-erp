# Dental ERP — nginx site yapılandırması (Aşama 30)
#
# Kurulum:
#   sudo cp deploy/nginx/dental-erp.conf /etc/nginx/sites-available/dental-erp
#   sudo ln -s /etc/nginx/sites-available/dental-erp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sonra HTTPS için (alan adı yoksa sslip.io kullanılır, bkz. docs/sunucu-kurulumu.md):
#   sudo certbot --nginx -d <SUNUCU_ADI>
#
# certbot bu dosyayı kendisi düzenler: 443 bloğunu, sertifika yollarını ve
# 80 -> 443 yönlendirmesini ekler. Aşağıdaki dosya certbot ÖNCESİ hâlidir.
#
# Değiştirilmesi gerekenler:
#   <SUNUCU_ADI>  -> ör. 1-2-3-4.sslip.io  (ileride gerçek alan adı)
#   php8.3-fpm    -> sunucudaki PHP sürümü (Ubuntu 24.04 varsayılanı 8.3)

server {
    listen 80;
    listen [::]:80;
    server_name <SUNUCU_ADI>;

    root /var/www/dental-erp/public;
    index index.php;

    charset utf-8;

    # Rapor dışa aktarımı ve ürün görseli yüklemeleri için. Laravel tarafındaki
    # doğrulama zaten daha düşük sınırlar koyuyor; bu yalnızca nginx'in erken
    # kesmemesi içindir.
    client_max_body_size 32M;

    # Sunucu sürümünü gizle.
    server_tokens off;

    # ---------------------------------------------------------------------
    # PWA dosyaları
    # ---------------------------------------------------------------------

    # Bilinen eksik (Aşama 21): nginx .webmanifest uzantısını tanımaz ve
    # application/octet-stream döndürür. Bu içerik türüyle Chrome manifest'i
    # yok sayar, "Ana ekrana ekle" hiç çıkmaz.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Service worker'ın kapsamı kök dizin ve kendisi ÖNBELLEĞE ALINMAMALI:
    # eski bir sw.js tarayıcıda takılı kalırsa yeni sürüm günlerce gelmez.
    location = /sw.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ---------------------------------------------------------------------
    # Statik dosyalar
    # ---------------------------------------------------------------------

    # Vite çıktısının dosya adları hash'li, sonsuza kadar önbelleğe alınabilir.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Gizli dosyalar (.env, .git ...) hiçbir koşulda servis edilmez.
    # .well-known certbot'un HTTP doğrulaması için açık kalmalı.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---------------------------------------------------------------------
    # Uygulama
    # ---------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Kuyruğa alınamayan uzun isteklerde (büyük PDF) erken kesilmesin.
        fastcgi_read_timeout 120s;

        internal;
    }

    # public/ içindeki başka bir .php dosyası çalıştırılamaz.
    location ~ \.php$ {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Sıkıştırma
    # ---------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Güvenlik başlıkları
    # ---------------------------------------------------------------------
    #
    # HSTS certbot HTTPS'i kurduktan SONRA açılmalıdır; sertifika yokken
    # açılırsa siteye hiç erişilemez hâle gelir.
    #   add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/dental-erp.access.log;
    error_log  /var/log/nginx/dental-erp.error.log;
}
