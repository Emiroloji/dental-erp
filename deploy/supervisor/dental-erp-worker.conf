; Aşama 28 — kuyruk worker'ının production kurulumu.
;
; Kurulum:
;   sudo cp deploy/supervisor/dental-erp-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status dental-erp-worker:*
;
; Yol (/var/www/dental-erp) ve kullanıcı (www-data) sunucuya göre düzenlenir.
; Dağıtımdan sonra worker'ın yeni kodu alması için:
;   php artisan queue:restart

[program:dental-erp-worker]
process_name=%(program_name)s_%(process_num)02d
; Bağlantı adı bilerek yazılmaz: QUEUE_CONNECTION (.env) neyse o kullanılır.
; Daha önce burada "redis" yazıyordu; .env'de database seçiliyken worker
; hiç iş almıyordu (Aşama 30'da düzeltildi).
; --memory=512: XLSX/PDF üretimi bellek yoğun, varsayılan 128 MB yetmiyor;
; worker bu sınırı aşınca kendini kapatır ve Supervisor temiz başlatır.
command=php /var/www/dental-erp/artisan queue:work --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600 --max-jobs=500 --memory=512
directory=/var/www/dental-erp
autostart=true
autorestart=true
; Kod dağıtımı sırasında queue:restart ile kapanan worker'ı Supervisor hemen
; yeniden başlatır; bu yüzden "beklenen" çıkış kodu 0'dır.
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/dental-erp/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
