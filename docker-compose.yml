services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_erp
      POSTGRES_USER: dental_erp
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - dental-erp-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - dental-erp-redis:/data

volumes:
  dental-erp-postgres:
  dental-erp-redis:
