<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1a1c">
    <title>Bağlantı yok — Dental ERP</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f7f6; color: #16211f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
        main { max-width: 360px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
        p { font-size: 15px; line-height: 1.5; color: #5c6d69; margin: 0 0 24px; }
        button { font: inherit; font-size: 15px; font-weight: 500; color: #fff; background: #0e1a1c; border: 0; border-radius: 8px; padding: 12px 20px; width: 100%; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>İnternet bağlantısı yok</h1>
        <p>Stok kayıtları her zaman sunucuda tutulur; çevrimdışıyken işlem yapılamaz. Bağlantı gelince kaldığınız yerden devam edebilirsiniz.</p>
        <button type="button" onclick="location.reload()">Tekrar Dene</button>
    </main>
</body>
</html>
