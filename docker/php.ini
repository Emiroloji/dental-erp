; Dental ERP — canlı PHP ayarları (Dockerfile).
; XLSX/PDF üretimi bellek yoğun; worker'daki queue:work --memory=512 ile uyumlu.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Kod yalnızca yeni imajla değişir; dosya zamanını kontrol etmeye gerek yok.
opcache.validate_timestamps = 0
